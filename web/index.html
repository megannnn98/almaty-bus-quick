<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Быстрый автобус</title>
  <meta name="description" content="Номер автобуса или троллейбуса Алматы — и сразу маршрут в 2ГИС.">
  <meta name="theme-color" content="#F2F3F5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Автобус">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Material Icons (Apache License 2.0), same set as the Android app. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-bus" viewBox="0 0 24 24"><path d="M4,16c0,0.88 0.39,1.67 1,2.22V20c0,0.55 0.45,1 1,1h1c0.55,0 1,-0.45 1,-1v-1h8v1c0,0.55 0.45,1 1,1h1c0.55,0 1,-0.45 1,-1v-1.78c0.61,-0.55 1,-1.34 1,-2.22V6c0,-3.5 -3.58,-4 -8,-4s-8,0.5 -8,4v10zM7.5,17c-0.83,0 -1.5,-0.67 -1.5,-1.5S6.67,14 7.5,14s1.5,0.67 1.5,1.5S8.33,17 7.5,17zM16.5,17c-0.83,0 -1.5,-0.67 -1.5,-1.5s0.67,-1.5 1.5,-1.5 1.5,0.67 1.5,1.5 -0.67,1.5 -1.5,1.5zM18,11H6V6h12v5z"/></symbol>
    <symbol id="i-trolleybus" viewBox="0 0 24 24"><path d="M19,16.94V8.5c0,-2.79 -2.61,-3.4 -6.01,-3.49l0.76,-1.51H17V2H7v1.5h4.75l-0.76,1.52C7.86,5.11 5,5.73 5,8.5v8.44c0,1.45 1.19,2.66 2.59,2.97L6,21.5v0.5h2.23l2,-2H14l2,2h2v-0.5L16.5,20h-0.08c1.69,0 2.58,-1.37 2.58,-3.06zM12,18.5c-0.83,0 -1.5,-0.67 -1.5,-1.5s0.67,-1.5 1.5,-1.5 1.5,0.67 1.5,1.5 -0.67,1.5 -1.5,1.5zM17,14H7V9h10v5z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><path d="M11.99,2C6.47,2 2,6.48 2,12s4.47,10 9.99,10C17.52,22 22,17.52 22,12S17.52,2 11.99,2zM12,20c-4.42,0 -8,-3.58 -8,-8s3.58,-8 8,-8 8,3.58 8,8 -3.58,8 -8,8zM12.5,7H11v6l5.25,3.15 0.75,-1.23 -4.5,-2.67z"/></symbol>
    <symbol id="i-place" viewBox="0 0 24 24"><path d="M12,2C8.13,2 5,5.13 5,9c0,5.25 7,13 7,13s7,-7.75 7,-13c0,-3.87 -3.13,-7 -7,-7zM12,11.5c-1.38,0 -2.5,-1.12 -2.5,-2.5s1.12,-2.5 2.5,-2.5 2.5,1.12 2.5,2.5 -1.12,2.5 -2.5,2.5z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12,4l-1.41,1.41L16.17,11H4v2h12.17l-5.58,5.59L12,20l8,-8z"/></symbol>
    <symbol id="i-backspace" viewBox="0 0 24 24"><path d="M22,3H7c-0.69,0 -1.23,0.35 -1.59,0.88L0,12l5.41,8.11c0.36,0.53 0.9,0.89 1.59,0.89h15c1.1,0 2,-0.9 2,-2V5c0,-1.1 -0.9,-2 -2,-2zM22,19H7.07L2.4,12l4.66,-7H22v14zM10.41,17L14,13.41 17.59,17 19,15.59 15.41,12 19,8.41 17.59,7 14,10.59 10.41,7 9,8.41 12.59,12 9,15.59z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M19,6.41L17.59,5 12,10.59 6.41,5 5,6.41 10.59,12 5,17.59 6.41,19 12,13.41 17.59,19 19,17.59 13.41,12z"/></symbol>
  </svg>

  <main class="app">
    <header class="header">
      <div class="logo" aria-hidden="true"><svg class="icon"><use href="#i-bus"/></svg></div>
      <div>
        <h1>Быстрый автобус</h1>
        <p class="subtitle">Алматы · маршрут в 2ГИС</p>
      </div>
    </header>

    <!-- Recent shortcuts sit at the top, away from the keypad: a chip opens 2ГИС at once. -->
    <section id="recent" class="recent" aria-labelledby="recent-title" hidden>
      <h2 id="recent-title"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>Недавние</h2>
      <div id="chips" class="chips"></div>
    </section>

    <div class="segments" role="radiogroup" aria-label="Вид транспорта">
      <button type="button" class="segment" role="radio" data-transport="bus">
        <svg class="icon" aria-hidden="true"><use href="#i-bus"/></svg>Автобус
      </button>
      <button type="button" class="segment" role="radio" data-transport="trolleybus">
        <svg class="icon" aria-hidden="true"><use href="#i-trolleybus"/></svg>Троллейбус
      </button>
    </div>

    <div class="field">
      <output id="number" class="number" aria-label="Номер маршрута">—</output>
      <button type="button" id="clear" class="clear" aria-label="Очистить номер">
        <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </div>
    <p id="hint" class="hint" aria-live="polite">Введите номер маршрута</p>

    <div id="keypad" class="keypad">
      <button type="button" class="key" data-key="1">1</button>
      <button type="button" class="key" data-key="2">2</button>
      <button type="button" class="key" data-key="3">3</button>
      <button type="button" class="key" data-key="4">4</button>
      <button type="button" class="key" data-key="5">5</button>
      <button type="button" class="key" data-key="6">6</button>
      <button type="button" class="key" data-key="7">7</button>
      <button type="button" class="key" data-key="8">8</button>
      <button type="button" class="key" data-key="9">9</button>
      <button type="button" class="key key-muted" data-key="C" aria-label="Очистить">C</button>
      <button type="button" class="key" data-key="0">0</button>
      <button type="button" class="key key-muted" data-key="⌫" aria-label="Стереть цифру">
        <svg class="icon" aria-hidden="true"><use href="#i-backspace"/></svg>
      </button>
    </div>

    <a id="open" class="open" target="_blank" rel="noopener" aria-disabled="true">
      <svg class="icon" aria-hidden="true"><use href="#i-place"/></svg>
      <span id="open-label">Открыть маршрут в 2ГИС</span>
      <svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg>
    </a>
    <p class="footnote">Справочник работает без интернета. Для карты нужен 2ГИС или браузер.</p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
